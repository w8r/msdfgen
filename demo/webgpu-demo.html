<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU MSDF Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        overflow: hidden;
      }

      #webgpu-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #1a1a1a;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #webgpu-error {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #2a2a2a;
        border: 2px solid #667eea;
        border-radius: 10px;
        padding: 40px;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }

      #webgpu-error h2 {
        font-size: 1.8em;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      #webgpu-error p {
        color: #b0b0b0;
        font-size: 1.1em;
        line-height: 1.6;
        margin-bottom: 15px;
      }

      #webgpu-error .supported-browsers {
        color: #888;
        font-size: 0.95em;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #333;
      }

      #webgpu-error .supported-browsers strong {
        color: #667eea;
      }
    </style>
  </head>
  <body>
    <canvas id="webgpu-canvas"></canvas>

    <div id="webgpu-error">
      <h2>WebGPU Not Available</h2>
      <p>
        This demo requires WebGPU support, which is not available in your current browser.
      </p>
      <div class="supported-browsers">
        <strong>Supported Browsers:</strong><br>
        Chrome 113+, Edge 113+, or Safari 18+
      </div>
    </div>

    <script type="module" src="./webgpu-demo.ts"></script>
  </body>
</html>
